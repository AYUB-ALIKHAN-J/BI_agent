[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-bi"
version = "0.1.0"
description = "AI-Powered E-Commerce Decision Intelligence System (Agentic BI on Olist)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "langchain-groq>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.24"]
analytics = ["scikit-learn>=1.5", "statsmodels>=0.14", "mlxtend>=0.23"]
agent = ["langgraph>=0.2", "langchain-ollama>=0.2", "langchain-groq>=0.2", "langchain-core>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
olist-bi = "olist_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/olist_bi/warehouse/kpis.py" = ["E501"]
"src/olist_bi/etl/validate.py" = ["E501"]

[tool.setuptools.package-data]
olist_bi = ["etl/schema.sql"]
