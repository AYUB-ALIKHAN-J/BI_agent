# Usage:
#   docker compose --profile etl run --rm etl     # build the warehouse from data/raw
#   docker compose up app                          # dashboard on http://localhost:8501
#   docker compose --profile dev run --rm synth    # generate synthetic data first (dev only)
#   docker compose --profile ollama up -d          # start Ollama container (backup)

x-common: &common
  build: .
  environment:
    OLIST_DATA_DIR: /app/data/raw
    OLIST_WAREHOUSE_PATH: /app/warehouse/olist.duckdb
    # Iteration 4: reach the Ollama (local machine or Docker container)
    # For local Ollama: OLLAMA_BASE_URL=http://host.docker.internal:11434
    # For Docker Ollama: OLLAMA_BASE_URL=http://ollama:11434 (default)
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}  # llama3.1 for tool calling, qwen2.5-coder:7b for coding tasks
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data
    - ./warehouse:/app/warehouse

services:
  app:
    <<: *common
    ports:
      - "8501:8501"
    restart: unless-stopped
    profiles: ["default"]

  etl:
    <<: *common
    command: ["olist-bi", "etl"]
    profiles: ["etl"]

  synth:
    <<: *common
    command: ["olist-bi", "synth"]
    profiles: ["dev"]

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["ollama"]
    restart: unless-stopped

volumes:
  ollama_data:
